name: Build Signed Play Store AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/foosball-clash-upload.jks

      - name: Give Gradle Permission
        run: chmod +x android/gradlew

      - name: Build Signed Release AAB
        run: |
          cd android
          ./gradlew bundleRelease \
          -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/foosball-clash-upload.jks" \
          -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
          -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
          -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: foosball-clash-playstore-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
